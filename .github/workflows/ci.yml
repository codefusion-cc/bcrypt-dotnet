name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      # .NET 11 is a release candidate until November 2026; drop dotnet-quality once it ships.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: dotnet build -c Release
      - name: Test on .NET 8, 9, 10 and 11
        run: |
          for f in net8.0 net9.0 net10.0 net11.0; do
            dotnet test --project tests/CodeFusion.Security.Bcrypt.Tests -c Release --no-build -f $f -- --max-threads 2 --timeout 10m
          done
      - run: dotnet pack src/CodeFusion.Security.Bcrypt -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.arch == 'x64'
        with:
          name: packages
          path: artifacts/

  # Publishes on a version tag (v1.2.3) through NuGet trusted publishing: no long-lived API key. Needs a trusted
  # publishing policy on nuget.org for this repository and workflow, and the NUGET_USER secret (the nuget.org
  # profile name) in the "nuget" environment.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      # .NET 11 is a release candidate until November 2026; drop dotnet-quality once it ships.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Pack
        run: dotnet pack src/CodeFusion.Security.Bcrypt -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
